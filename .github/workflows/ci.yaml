name: CI

on:
  pull_request:

permissions:
  contents: read

jobs:
  lint-and-format:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

  unit-tests:
    needs: lint-and-format
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      
  unit-tests:
    needs: lint-and-format
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build shared database package
        run: npm run build:database

      - name: Typecheck TestOrchestra
        run: npx tsc --noEmit

      - name: Typecheck Dashboard API
        run: npm run typecheck --workspace=api

      - name: Run Vitest
        run: npm run tests


  e2e-tests:
    needs: unit-tests

    uses: ./.github/workflows/test-run.yaml

    with:
      report: robot
    secrets: inherit
