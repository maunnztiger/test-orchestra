name: test-run

on:
  workflow_call:
    inputs:
      report:
        required: false
        type: string
        default: "json"

jobs:
  run-tests:
    runs-on: ubuntu-latest

    env:
      APP_URL: ${{ secrets.APP_URL }}
      USER_NAME: ${{ secrets.USER_NAME }}
      USER_PASSWD: ${{ secrets.USER_PASSWD }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install chromium

      - name: Run TestOrchestra - Sauce Labs Login
        run: |
          CI=true npm run login -- --report ${{ inputs.report }}

      - name: Upload report Robot XML
        if: ${{ inputs.report == 'robot' }}
        uses: actions/upload-artifact@v4
        with:
          name: testorchestra-robot-report
          path: reports/robot-output.xml

      - name: Run TestOrchestra - Sauce Labs Filters
        run: |
          CI=true npm run filters -- --report ${{ inputs.report }}

      - name: Upload report Robot XML
        if: ${{ inputs.report == 'robot' }}
        uses: actions/upload-artifact@v4
        with:
          name: testorchestra-robot-report
          path: reports/robot-output.xml
