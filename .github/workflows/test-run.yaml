name: test-run

on:
  workflow_call:
    inputs:
      report:
        required: false
        type: string
        default: "json"

jobs:
  run-tests:
    runs-on: ubuntu-latest

    env:
      APP_URL: ${{ secrets.APP_URL }}
      USER_NAME: ${{ secrets.USER_NAME }}
      USER_PASSWD: ${{ secrets.USER_PASSWD }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run TestOrchestra - Sauce Labs Login
        run: CI=true npm run login -- --report "${{ inputs.report }}"

      - name: Upload Login Robot XML
        if: ${{ inputs.report == 'robot' }}
        uses: actions/upload-artifact@v6
        with:
          name: testorchestra-login-robot-report
          path: reports/robot-output.xml
          if-no-files-found: error
          retention-days: 14

      - name: Run TestOrchestra - Sauce Labs Filters
        run: CI=true npm run filters -- --report "${{ inputs.report }}"

      - name: Upload Filters Robot XML
        if: ${{ inputs.report == 'robot' }}
        uses: actions/upload-artifact@v6
        with:
          name: testorchestra-filters-robot-report
          path: reports/robot-output.xml
          if-no-files-found: error
          retention-days: 14
